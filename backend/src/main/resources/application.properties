spring.application.name=Five2Nine
# Database connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/five2nine?useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA/Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=replace-this-with-a-long-random-secret-key-at-least-32-characters
jwt.expiration=172800000
